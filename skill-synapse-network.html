nodes.forEach(n => {
  n.r = Math.max(5, rScale(n.refs || 0));
  n.cat = catColors[n.category] || '#64748b';
});

// 力导向

  .force('link', d3.forceLink(links).id(d => d.id).distance(l => l.source.r + l.target.r + 60))
  .force('charge', d3.forceManyBody().strength(d => -80 - d.refs * 3))
  .force('center', d3.forceCenter(width / 2, height / 2))
  .force('collide', d3.forceCollide().radius(d => d.r + 14));

// 中枢锚定（refs >= 15 放中间附近）
sim.force('x', d3.forceX(d => d.refs >= 15 ? width/2 + (Math.random()-0.5)*100 : width/2).strength(0.05));
sim.force('y', d3.forceY(d => d.refs >= 15 ? height/2 + (Math.random()-0.5)*80 : height/2).strength(0.05));

  .attr('stroke', d => d.cat)
  .attr('stroke-width', 2)
  .style('cursor', 'pointer')
  .call(d3.drag()
    .on('start', dragstarted)
    .on('drag', dragged)
    .on('end', dragended));

// 高频强化脉动环（refs >= 15 的中枢）

    d3.zoom().transform,
    d3.zoomIdentity.translate(width/2 - d.x*k, height/2 - d.y*k).scale(k)
  );
});

sim.on('tick', () => {
  link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  synapsis.attr('cx', d => (d.source.x + d.target.x)/2)

  halos.attr('cx', d => d.x).attr('cy', d => d.y);
  node.attr('cx', d => d.x).attr('cy', d => d.y);
  pulses.attr('cx', d => d.x).attr('cy', d => d.y);
  labels.attr('x', d => d.x).attr('y', d => d.y);
});

function dragstarted(e, d) {
  if (!e.active) sim.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
function dragended(e, d) {
  if (!e.active) sim.alphaTarget(0);
  d.fx = null; d.fy = null;
}
