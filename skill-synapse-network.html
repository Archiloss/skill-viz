// 贝塞尔控制点(神经纤维弯曲)
function curvePath(d) {
  const x1 = d.source.x, y1 = d.source.y, x2 = d.target.x, y2 = d.target.y;
  const dx = x2 - x1, dy = y2 - y1;
  const dist = Math.max(1, Math.hypot(dx, dy));
  // 垂直于连线偏移,偏移量随距离增大而增大
  const bend = Math.min(60, dist * 0.18);
  const mx = (x1 + x2) / 2 - (dy / dist) * bend;
  const my = (y1 + y2) / 2 + (dx / dist) * bend;
  return `M ${x1},${y1} Q ${mx},${my} ${x2},${y2}`;
}

             <div class="row"><span class="k">体积</span><span>${(d.size/1024).toFixed(1)} KB</span></div>
             <div class="row"><span class="k">类型</span><span>${d.refs >= 15 ? '中枢' : d.refs >= 5 ? '专项' : '末梢'}</span></div>`)
      .style('left', (e.pageX + 14) + 'px').style('top', (e.pageY - 10) + 'px');
  })
  .on('mousemove', (e) => {
    tooltip.style('left', (e.pageX + 14) + 'px').style('top', (e.pageY - 10) + 'px');
  })
  .on('mouseout', () => tooltip.style('display', 'none'));

// 悬停高亮邻接子图
function neighborsOf(id) {
  const s = new Set([id]);
  links.forEach(l => {
    if (l.source === id || (l.source && l.source.id === id)) s.add(l.target && l.target.id ? l.target.id : l.target);
    if (l.target === id || (l.target && l.target.id === id)) s.add(l.source && l.source.id ? l.source.id : l.source);
  });
  return s;
}
node.on('mouseenter', (e, d) => {
  const s = neighborsOf(d.id);
  node.attr('opacity', n => s.has(n.id) ? 1 : 0.12);
  labels.attr('opacity', n => s.has(n.id) ? 1 : 0.1);
  link.attr('stroke-opacity', l => {
    const a = l.source.id || l.source, b = l.target.id || l.target;
    return (s.has(a) && s.has(b)) ? 0.8 : 0.04;
  });
  halos.attr('opacity', n => s.has(n.id) ? 1 : 0.08);
  pulses.attr('opacity', n => s.has(n.id) ? 1 : 0.05);
});
node.on('mouseleave', () => {
  node.attr('opacity', 1);
  labels.attr('opacity', 1);
  link.attr('stroke-opacity', 0.45);
  halos.attr('opacity', 1);
  pulses.attr('opacity', 1);
});

// 双击聚焦
node.on('dblclick', (e, d) => {
  const k = 1.5;
  svg.transition().duration(600).call(
    d3.zoom().transform,
    d3.zoomIdentity.translate(width/2 - d.x*k, height/2 - d.y*k).scale(k)
  );
});

sim.on('tick', () => {
  link.attr('d', curvePath);
  halos.attr('cx', d => d.x).attr('cy', d => d.y);
  node.attr('cx', d => d.x).attr('cy', d => d.y);
  pulses.attr('cx', d => d.x).attr('cy', d => d.y);
  labels.attr('x', d => d.x).attr('y', d => d.y);
});

// 信号粒子动画已移除（性能原因）

// 加载淡入
setTimeout(() => d3.select('#container').classed('ready', true), 50);

function dragstarted(e, d) {
  if (!e.active) sim.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
function dragended(e, d) {
  if (!e.active) sim.alphaTarget(0);
  // 拖完固定在新位置,不被力模拟弹回
  d.fx = d.x; d.fy = d.y;
}

// 重置布局：释放所有固定点，重新跑力模拟
document.getElementById('resetBtn').addEventListener('click', () => {
  nodes.forEach(n => { n.fx = null; n.fy = null; });
  sim.alpha(1).restart();
});

// 脉动动画开关（默认关——省性能；开启后中枢节点脉冲扩散）
let pulseOn = false;
document.getElementById('pulseBtn').addEventListener('click', () => {
  pulseOn = !pulseOn;
  pulses.classed('on', pulseOn);
  document.getElementById('pulseBtn').textContent = pulseOn ? '⏸ 关闭脉动' : '✨ 开启脉动';
  document.getElementById('pulseBtn').style.background = pulseOn ? 'rgba(34,211,238,0.25)' : 'rgba(34,211,238,0.15)';
});
</script>
</body>
